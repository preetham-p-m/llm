[project]
name = "llm-learning-project"
version = "0.1.0"
description = "Learning resources and notebooks for agent-based AI projects"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate",
    "anthropic",
    "beautifulsoup4",
    "bitsandbytes",
    "chromadb",
    "datasets",
    "diffusers",
    "docarray",
    "faiss-cpu",
    "feedparser",
    "gensim",
    "google-genai",
    "gradio",
    "ipywidgets",
    "jupyter-dash",
    "jupyterlab",
    "langchain>=0.3,<1",
    "langchain-chroma>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<1",
    "langchain-experimental>=0.3,<0.4",
    "langchain-google-genai>=2,<3",
    "langchain-openai>=0.3,<1",
    "langchain-text-splitters>=0.3,<1",
    "matplotlib",
    "modal",
    "numpy",
    "ollama",
    "openai",
    "pandas",
    "plotly",
    "psutil",
    "pydub",
    "pyarrow",
    "python-dotenv",
    "requests",
    "scikit-learn",
    "scipy",
    "sentence-transformers",
    "sentencepiece",
